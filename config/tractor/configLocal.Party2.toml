## Shared keys
shared_keys_path = "example_data/keys"

## Data files
geno_binary_file_prefix = "tractor_fixture/party2/geno"
geno_block_size_file = "tractor_fixture/party2/geno_block_sizes.txt"
pheno_file = "tractor_fixture/party2/pheno.txt"
covar_file = "tractor_fixture/party2/cov.txt"
snp_position_file = "tractor_fixture/party2/snp_pos.txt"

## Tractor: ancestry-partitioned genotype dosage
tractor_geno_prefix_a = "tractor_fixture/party2/tractor_a"
